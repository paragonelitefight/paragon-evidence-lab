name: Build isolated protocol gateway and ROFL input
on:
  workflow_dispatch:
    inputs:
      qualify_new_gateway:
        description: Qualify only the NEW ANP-WBA-AP2 gateway in explicit non-TEE synthetic mode
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: paragon-advanced-gateway
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Restore self-contained public source input
        shell: bash
        env:
          SOURCE_B64: 
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paragon-advanced/advanced"
          python3 - <<'PY'
          import os,json,gzip,base64,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'paragon-advanced'/'advanced'
          for name,content in json.loads(gzip.decompress(base64.b64decode(os.environ['SOURCE_B64']))).items():
              path=pathlib.PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts:raise SystemExit('Invalid source path')
              target=root.joinpath(*path.parts);target.parent.mkdir(parents=True,exist_ok=True);target.write_text(content,encoding='utf-8')
          PY
      - name: Resolve immutable public Python base and complete dependency wheel set
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 docker.io/library/python:3.12-slim
          image="$(docker image inspect docker.io/library/python:3.12-slim --format '{{index .RepoDigests 0}}')"
          [[ "$image" =~ ^(docker.io/library/)?python@sha256:[0-9a-f]{64}$ ]]
          printf 'BASE_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          docker run --rm --platform linux/amd64 -v "$RUNNER_TEMP/paragon-advanced/advanced:/work" -w /work "$image" python -m pip download --only-binary=:all: --no-cache-dir -d wheels -r requirements.txt
      - name: Render digest-pinned measured-compose source without publishing an image
        id: render
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 -v "$RUNNER_TEMP/paragon-advanced/advanced:/work" -w /work "$BASE_IMAGE" python render_rofl.py --image "$BASE_IMAGE"
      - name: Optional single qualification of NEW gateway only, not hardware TEE
        id: qualify
        if: inputs.qualify_new_gateway
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 -v "$RUNNER_TEMP/paragon-advanced/advanced:/work" -w /work "$BASE_IMAGE" sh -c 'python -m pip install --no-cache-dir --disable-pip-version-check --require-hashes --only-binary=:all: --target /tmp/paragon-deps -r requirements.lock.txt >/dev/null && PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/tmp/paragon-deps:/work/vendor:/work python exercise_gateway.py'
      - name: Honest summary
        if: always()
        env:
          RENDER: ${{ steps.render.outcome }}
          QUALIFY: ${{ steps.qualify.outcome }}
        shell: bash
        run: |
          {
            echo '## New isolated gateway build'
            echo "Compose render: $RENDER"
            echo "New synthetic non-TEE gateway qualification: $QUALIFY"
            echo 'This workflow does NOT re-run prior ZK, FHE, TLC or old browser checks.'
            echo 'No wallet created/imported, no token transaction, no app registration, no deployment, no private documents or real payments.'
            echo 'No custom image push, package publication, cache or artifact upload.'
            echo 'Actual hardware TEE execution and independent attestation are NOT established by this workflow.'
            echo 'Compose file is encoded between PARAGON_COMPOSE_BEGIN and PARAGON_COMPOSE_END in the render step log.'
            echo 'A successful optional new-source check is scoped to one-process synthetic HTTP profiles and the pinned SDK, not external conformance.'
          } >> "$GITHUB_STEP_SUMMARY"
