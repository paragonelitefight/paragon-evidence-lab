name: Paragon final testnet bundle (ANP-WBA-AP2)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paragon-isolated-final-build
  cancel-in-progress: false
jobs:
  qualify-and-build:
    if: github.event.repository.private == false && github.repository == 'paragonelitefight/paragon-evidence-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Restore public source and registered TESTNET manifest (no wallet)
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null
          command -v gh >/dev/null
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 \
            -o paragon-final-source.b64.txt "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/paragon-final-source.b64.txt"
          echo '884d96e87e14493c2e62c19e3bc0a20a0ff454d7b4741f1ead39bf66ddc65424  paragon-final-source.b64.txt' | sha256sum --check --strict
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib
          encoded=pathlib.Path('paragon-final-source.b64.txt').read_text().strip()
          payload=json.loads(gzip.decompress(base64.b64decode(encoded)))
          patch_raw=gzip.decompress(base64.b64decode(''))
          if hashlib.sha256(patch_raw).hexdigest()!='c2a9758c7c8a9acdd1c5af00c11f89298ddac232b55bddc33e434d0622a72107':raise SystemExit('Public patch integrity mismatch')
          patch=json.loads(patch_raw)
          previous=payload['registry']
          if payload['worker'].count(previous)!=1:raise SystemExit('Unexpected Worker registry source; no ambiguous patch')
          payload['worker']=payload['worker'].replace(previous,patch['registry'],1)
          for name in ('prepare','finish','registry','registryCheck','installer'):payload[name]=patch[name]
          for name,key in [('identity_rules.py','identityRules'),('test_identity_rules.py','identityTests'),('test-installer-syntax.ps1','installerTests')]:pathlib.Path(name).write_text(patch[key])
          encoded=base64.b64encode(gzip.compress(json.dumps(payload,separators=(',',':')).encode(),mtime=0)).decode()
          parts=[encoded[i:i+30000] for i in range(0,len(encoded),30000)]
          os.environ['SOURCE_PARTS']=str(len(parts))
          for i,part in enumerate(parts):os.environ['SOURCE_PART_'+str(i)]=part
          pathlib.Path('prepare_build.py').write_text(payload['prepare'])
          pathlib.Path('finish_build.py').write_text(payload['finish'])
          exec(compile(payload['prepare'],'prepare_build.py','exec'))
          PY
      - name: Worker syntax, finite expiry, relay security and registry binding logic (isolated)
        shell: bash
        run: |
          set -euo pipefail
          (
            python3 -m py_compile prepare_build.py finish_build.py identity_rules.py test_identity_rules.py || exit 1
            python3 test_identity_rules.py || exit 1
            pwsh -NoLogo -NoProfile -File test-installer-syntax.ps1 || exit 1
            node --check worker-template.mjs || exit 1
            node --check worker-advanced-proxy.js || exit 1
            node --check registry-verifier.js || exit 1
            node -e 'const fs=require("fs");const text=fs.readFileSync("worker-template.mjs","utf8");const line=text.split("\n")[1];const prefix="const BUNDLE_ASSETS = ";if(!line.startsWith(prefix))throw Error("Unexpected assembly");const assets=JSON.parse(line.slice(prefix.length));fs.writeFileSync("browser-candidate.mjs",assets["/advanced.mjs"].text);' || exit 1
            node --check browser-candidate.mjs || exit 1
            node check-worker-relay.mjs || exit 1
            node check-registry.mjs || exit 1
          ) 2>&1 | tee out/worker-checks.log
      - name: One combined actual HTTP qualification - ANP, WBA and synthetic AP2 (NOT TEE)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 -e PYTHONDONTWRITEBYTECODE=1             -v "$PWD/runtime:/app:ro"             docker.io/library/python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b             python -c 'import os,subprocess,sys; subprocess.run([sys.executable,"-m","pip","install","--no-cache-dir","--disable-pip-version-check","--require-hashes","--only-binary=:all:","--target","/tmp/deps","-r","/app/requirements.lock.txt"],check=True,stdout=subprocess.DEVNULL); env=os.environ.copy(); env["PYTHONPATH"]="/tmp/deps:/app/vendor:/app"; subprocess.run([sys.executable,"/app/exercise_gateway.py"],env=env,check=True)'             2>&1 | tee out/protocol-execution.log
      - name: Download checksum-pinned official CLI and build actual ORC (NO deployment)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oasis-cli
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2             -o oasis-cli.tar.gz https://github.com/oasisprotocol/cli/releases/download/v0.23.0/oasis_cli_0.23.0_linux_amd64.tar.gz
          echo 'da9c7bb239d809f19c805250fa89458b8826c4843d62acc1bb1faa64419208c1  oasis-cli.tar.gz' | sha256sum --check --strict
          tar -xzf oasis-cli.tar.gz --no-same-owner -C oasis-cli
          CLI=$(find "$PWD/oasis-cli" -type f -name oasis -print -quit)
          test -n "$CLI"
          chmod u+x "$CLI"
          "$CLI" --version
          # Ephemeral CI uses the CLI's documented first-run public defaults.
          # No custom empty profile, local-node command, wallet or on-chain operation.
          "$CLI" network list | tee out/ci-networks.txt
          if ! grep -Eq '^[[:space:]]*testnet([[:space:]]|$)' out/ci-networks.txt; then
            "$CLI" network add --help > out/network-add-help.txt
            for flag in --symbol --num-decimals --description; do
              grep -q -- "$flag" out/network-add-help.txt || { cat out/network-add-help.txt; exit 1; }
            done
            "$CLI" network add testnet testnet.grpc.oasis.io:443 --symbol TEST --num-decimals 9 --description 'Public TESTNET build only' -y
          fi
          "$CLI" paratime list | tee out/ci-paratimes.txt
          if ! grep -Eq 'testnet[[:space:]]+sapphire[[:space:]].*a6d1e3ebf60dff6c' out/ci-paratimes.txt; then
            "$CLI" paratime add testnet sapphire 000000000000000000000000000000000000000000000000a6d1e3ebf60dff6c --symbol TEST --num-decimals 18 --description 'Sapphire Testnet' -y
          fi
          cd app
          "$CLI" rofl build --deployment testnet 2>&1 | tee ../out/orc-build.log
          BUNDLE=$(find "$PWD" -maxdepth 1 -type f -name '*.orc' -print -quit)
          test -n "$BUNDLE"
          "$CLI" rofl identity "$BUNDLE" | tee ../out/enclave-identity.txt
          test -s ../out/enclave-identity.txt
      - name: Package actual results, bundle and source - never invent a pass
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f finish_build.py
          python3 finish_build.py
      - name: Publish this run's download as a GitHub Release (no Actions artifacts or Packages)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Always publish public diagnostics, even if packaging itself crashes.
          if ! test -f out/bundle-report.json; then
            mkdir -p out
            python3 - <<'PY'
          import json,os,pathlib,shutil
          out=pathlib.Path('out')
          for bundle in pathlib.Path('app').glob('*.orc'):
              if bundle.stat().st_size<2*1024**3:shutil.copyfile(bundle,out/('DIAGNOSTIC-'+bundle.name))
          report={'format':'paragon-coordinated-build/1','acceptedForLocalActivation':False,'bundle':None,'enclaveIdentities':[],'packagingErrors':['Packaging did not emit a report; public diagnostics only'],'runUrl':'https://github.com/'+os.environ.get('GITHUB_REPOSITORY','')+'/actions/runs/'+os.environ.get('GITHUB_RUN_ID',''),'sourceCommit':os.environ.get('GITHUB_SHA'),'machineCreated':False,'walletImported':False,'runtimeExecutedInTEE':False,'realPayments':False}
          (out/'bundle-report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          fi
          TAG="evidence-testnet-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' 'Public synthetic build evidence. Read bundle-report.json: local activation is allowed only when acceptedForLocalActivation is true. This job does not import a wallet, deploy, rent, make payments or verify a hardware quote. No new license for Paragon code is granted; vendored upstream licensing remains in the source archive.' > release-notes.txt
          printf '\nWorkflow: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Evidence testnet build $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --notes-file release-notes.txt out/*
          printf '\nDownload: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
