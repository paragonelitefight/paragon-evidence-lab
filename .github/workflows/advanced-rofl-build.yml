name: Paragon final testnet bundle (ANP-WBA-AP2)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paragon-isolated-final-build
  cancel-in-progress: false
jobs:
  qualify-and-build:
    if: github.event.repository.private == false && github.repository == 'paragonelitefight/paragon-evidence-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_PARTS: '31'
      SOURCE_PART_0: ''
      SOURCE_PART_1: ''
      SOURCE_PART_2: ''
      SOURCE_PART_3: ''
      SOURCE_PART_4: ''
      SOURCE_PART_5: ''
      SOURCE_PART_6: ''
      SOURCE_PART_7: ''
      SOURCE_PART_8: ''
      SOURCE_PART_9: ''
      SOURCE_PART_10: ''
      SOURCE_PART_11: ''
      SOURCE_PART_12: ''
      SOURCE_PART_13: ''
      SOURCE_PART_14: ''
      SOURCE_PART_15: ''
      SOURCE_PART_16: ''
      SOURCE_PART_17: ''
      SOURCE_PART_18: ''
      SOURCE_PART_19: ''
      SOURCE_PART_20: ''
      SOURCE_PART_21: ''
      SOURCE_PART_22: ''
      SOURCE_PART_23: ''
      SOURCE_PART_24: ''
      SOURCE_PART_25: ''
      SOURCE_PART_26: ''
      SOURCE_PART_27: ''
      SOURCE_PART_28: ''
      SOURCE_PART_29: ''
      SOURCE_PART_30: ''
    steps:
      - name: Restore public source and registered TESTNET manifest (no wallet)
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null
          command -v gh >/dev/null
          python3 - <<'PY'
          import base64,gzip,json,os,pathlib
          encoded=''.join(os.environ['SOURCE_PART_'+str(i)] for i in range(int(os.environ['SOURCE_PARTS'])))
          payload=json.loads(gzip.decompress(base64.b64decode(encoded)))
          pathlib.Path('prepare_build.py').write_text(payload['prepare'])
          pathlib.Path('finish_build.py').write_text(payload['finish'])
          exec(compile(payload['prepare'],'prepare_build.py','exec'))
          PY
      - name: Worker syntax, finite expiry, relay security and registry binding logic (isolated)
        shell: bash
        run: |
          set -euo pipefail
          (
            node --check worker-template.mjs || exit 1
            node --check worker-advanced-proxy.js || exit 1
            node --check registry-verifier.js || exit 1
            node -e 'const fs=require("fs");const text=fs.readFileSync("worker-template.mjs","utf8");const line=text.split("\n")[1];const prefix="const BUNDLE_ASSETS = ";if(!line.startsWith(prefix))throw Error("Unexpected assembly");const assets=JSON.parse(line.slice(prefix.length));fs.writeFileSync("browser-candidate.mjs",assets["/advanced.mjs"].text);' || exit 1
            node --check browser-candidate.mjs || exit 1
            node check-worker-relay.mjs || exit 1
            node check-registry.mjs || exit 1
          ) 2>&1 | tee out/worker-checks.log
      - name: One combined actual HTTP qualification - ANP, WBA and synthetic AP2 (NOT TEE)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 -e PYTHONDONTWRITEBYTECODE=1             -v "$PWD/runtime:/app:ro"             python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b             python -c 'import os,subprocess,sys; subprocess.run([sys.executable,"-m","pip","install","--no-cache-dir","--disable-pip-version-check","--require-hashes","--only-binary=:all:","--target","/tmp/deps","-r","/app/requirements.lock.txt"],check=True,stdout=subprocess.DEVNULL); env=os.environ.copy(); env["PYTHONPATH"]="/tmp/deps:/app/vendor:/app"; subprocess.run([sys.executable,"/app/exercise_gateway.py"],env=env,check=True)'             2>&1 | tee out/protocol-execution.log
      - name: Download checksum-pinned official CLI and build actual ORC (NO deployment)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oasis-cli
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2             -o oasis-cli.tar.gz https://github.com/oasisprotocol/cli/releases/download/v0.23.0/oasis_cli_0.23.0_linux_amd64.tar.gz
          echo 'da9c7bb239d809f19c805250fa89458b8826c4843d62acc1bb1faa64419208c1  oasis-cli.tar.gz' | sha256sum --check --strict
          tar -xzf oasis-cli.tar.gz --no-same-owner -C oasis-cli
          CLI=$(find "$PWD/oasis-cli" -type f -name oasis -print -quit)
          test -n "$CLI"
          chmod u+x "$CLI"
          "$CLI" --version
          CONFIG="$RUNNER_TEMP/paragon-public-build.toml"
          "$CLI" network add-local testnet testnet.grpc.oasis.io:443 --symbol TEST --num-decimals 9 --description 'Public TESTNET build only' -y --config "$CONFIG"
          "$CLI" paratime list --config "$CONFIG"
          cd app
          "$CLI" rofl build --deployment testnet --config "$CONFIG" 2>&1 | tee ../out/orc-build.log
          BUNDLE=$(find "$PWD" -maxdepth 1 -type f -name '*.orc' -print -quit)
          test -n "$BUNDLE"
          "$CLI" rofl identity "$BUNDLE" --config "$CONFIG" > ../out/enclave-identity.txt
          test -s ../out/enclave-identity.txt
      - name: Package actual results, bundle and source - never invent a pass
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f finish_build.py
          python3 finish_build.py
      - name: Publish this run's download as a GitHub Release (no Actions artifacts or Packages)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f out/bundle-report.json
          TAG="evidence-testnet-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' 'Public synthetic build evidence. Read bundle-report.json: local activation is allowed only when acceptedForLocalActivation is true. This job does not import a wallet, deploy, rent, make payments or verify a hardware quote. No new license for Paragon code is granted; vendored upstream licensing remains in the source archive.' > release-notes.txt
          printf '\nWorkflow: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Evidence testnet build $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --notes-file release-notes.txt out/*
          printf '\nDownload: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
