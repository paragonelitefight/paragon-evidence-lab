name: Manual synthetic PIR and source-package checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact repository commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Show available Node runtime
        run: node --version
      - name: Check local synthetic XOR PIR correctness
        run: node pir/test.mjs
      - name: Compare two clean source-package generations
        shell: bash
        run: |
          set -euo pipefail
          node build/pack.mjs
          cp research-source-package.json /tmp/first-research-source-package.json
          rm research-source-package.json
          node build/pack.mjs
          cmp /tmp/first-research-source-package.json research-source-package.json
          sha256sum research-source-package.json
          echo 'Same-job source-package repeatability only. Not independent Worker-build reproduction, formal verification or source authentication.'
